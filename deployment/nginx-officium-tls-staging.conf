# Disposable staging-only TLS configuration. Do not use this self-signed
# certificate layout in production; use the deployment guide and managed PKI.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/officium-staging.crt;
    ssl_certificate_key /etc/ssl/private/officium-staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /opt/officium/current/static/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
