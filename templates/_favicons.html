{%- set icon_version = config.APP_VERSION|urlencode -%}
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v={{ icon_version }}" sizes="32x32">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}?v={{ icon_version }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('static', filename='favicon-16x16.png') }}?v={{ icon_version }}" type="image/png" sizes="16x16">
<link rel="icon" href="{{ url_for('static', filename='favicon-32x32.png') }}?v={{ icon_version }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v={{ icon_version }}" sizes="180x180">
<link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}?v={{ icon_version }}">
