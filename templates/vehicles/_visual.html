{% macro visual(vehicle) %}
<svg class="vehicle-visual" viewBox="0 0 360 200" role="img" aria-label="{{ vehicle_bodies[vehicle.body_type] }}: {{ vehicle.name }}" style="color:{{ vehicle.color }}">
    <use href="{{ url_for('static', filename='images/vehicles/' ~ vehicle.body_type ~ '.svg') }}#body"/>
    {% if vehicle.plate %}
    <rect x="94" y="150" width="172" height="32" rx="4" fill="#fff" stroke="#17223b"/>
    <text x="104" y="172" fill="#17223b" font-size="18" font-family="sans-serif" font-weight="700">{{ vehicle.plate }}</text>
    {% if vehicle.country and vehicle.country.flag_path %}<image href="{{ url_for('static', filename=vehicle.country.flag_path) }}" x="236" y="157" width="24" height="16"/>
    {% elif vehicle.country %}<text x="239" y="170" fill="#17223b" font-size="8">{{ vehicle.country.code }}</text>{% endif %}
    {% endif %}
</svg>
{% endmacro %}
