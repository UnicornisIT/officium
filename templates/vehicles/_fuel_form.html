<form method="post" action="{{ url_for('vehicle_refueling',vehicle_id=vehicle.id,refueling_id=refueling.id) if refueling else url_for('vehicle_refueling',vehicle_id=vehicle.id,_method='POST') }}" class="vehicle-fuel-form vehicle-maintenance-card p-3 d-grid gap-3">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="vehicle-fuel-fields">
<label>Дата заправки<input class="form-control" type="date" name="refuel_date" value="{{ form.get('refuel_date',today.isoformat()) }}" max="{{ today }}" required></label>
<label>Пробег (км)<input class="form-control" type="text" name="odometer_km" value="{{ form.get('odometer_km') if form.get('odometer_km') is not none else '' }}" inputmode="numeric" data-vehicle-km pattern="[0-9 ]*"></label>
<label>Литры<input class="form-control" name="liters" inputmode="decimal" value="{{ form.get('liters','') }}" required></label>
<label>Цена за литр<input class="form-control" name="price_per_liter" inputmode="decimal" value="{{ form.get('price_per_liter','') }}" required></label>
<label>Итог, ₽<input class="form-control" name="total_amount" inputmode="decimal" value="{{ form.get('total_amount','') }}" required><small class="text-muted">Рассчитывается автоматически, можно изменить.</small></label>
<label>АЗС<input class="form-control" name="station_name" maxlength="150" value="{{ form.get('station_name') or '' }}"></label>
</div>
<fieldset><legend class="h6">Кто платит</legend>{% for key,label in [('self','Свои средства'),('organization','Организация')] %}{% if key=='self' or vehicle.is_company %}<label class="me-3"><input type="radio" name="payer" value="{{ key }}" {% if form.get('payer',vehicle.default_payer)==key %}checked{% endif %}> {{ label }}</label>{% endif %}{% endfor %}</fieldset>
<div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="fuelFullTank" name="is_full_tank" value="1" {% if form.get('is_full_tank',true) in (true,'1','on','true') %}checked{% endif %}><label class="form-check-label" for="fuelFullTank">До полного</label></div><input type="hidden" name="is_full_tank" value="0" data-fuel-unchecked>
<label>Комментарий<textarea class="form-control" name="comment" maxlength="2000">{{ form.get('comment') or '' }}</textarea></label>
<button class="btn btn-primary">Сохранить заправку</button>
</form>
<script src="{{ url_for('static',filename='js/vehicle-fuel.js',v='2') }}" defer></script>
